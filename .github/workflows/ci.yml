name: ci

on:
    push:
        branches: [ main ]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    static:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    coverage: none
            -   name: validate the manifest
                run: composer validate --strict
            -   name: resolve the composer cache directory
                id: composer-cache
                run: echo "path=$(composer config --global cache-files-dir)" >> "${GITHUB_OUTPUT}"
            -   uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.path }}
                    key: composer-8.2-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-8.2-
            -   name: install the locked dependencies
                run: composer install --no-progress --no-interaction --prefer-dist
            -   name: cs check
                run: composer cs-check

    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [ '8.2', '8.3', '8.4', '8.5' ]
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: none
            -   name: resolve the composer cache directory
                id: composer-cache
                run: echo "path=$(composer config --global cache-files-dir)" >> "${GITHUB_OUTPUT}"
            -   uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.path }}
                    key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-${{ matrix.php }}-
            -   name: install the locked dependencies
                run: composer install --no-progress --no-interaction --prefer-dist
            -   uses: actions/cache@v4
                with:
                    path: vendor/bin/.phpunit
                    key: phpunit-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
            -   name: phpstan
                run: composer phpstan
            -   name: test
                run: composer test

    integration:
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: test
                ports: [ '3306:3306' ]
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
            mariadb:
                image: mariadb:11.4
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: test
                ports: [ '3307:3306' ]
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
            postgresql:
                image: postgres:17-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: test
                ports: [ '5432:5432' ]
                options: >-
                    --health-cmd="pg_isready -U postgres -d test"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        env:
            DATABASE_URL_MYSQL: mysql://root:root@127.0.0.1:3306/test?serverVersion=8.4.0
            DATABASE_URL_MARIADB: mysql://root:root@127.0.0.1:3307/test?serverVersion=11.4.0-MariaDB
            DATABASE_URL_POSTGRESQL: postgresql://postgres:postgres@127.0.0.1:5432/test?serverVersion=17
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    extensions: pdo_mysql, pdo_pgsql
                    coverage: none
            -   name: resolve the composer cache directory
                id: composer-cache
                run: echo "path=$(composer config --global cache-files-dir)" >> "${GITHUB_OUTPUT}"
            -   uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.path }}
                    key: composer-8.2-${{ hashFiles('composer.lock') }}
                    restore-keys: composer-8.2-
            -   name: install the locked dependencies
                run: composer install --no-progress --no-interaction --prefer-dist
            -   name: integration suite
                run: composer test-integration -- --fail-on-skipped

    audit:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
                    coverage: none
            -   name: audit the locked dependencies
                run: composer deps-audit
